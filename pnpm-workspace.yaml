# Native build scripts are DENIED, each one explicitly.
#
# pnpm treats an *undecided* build script as an error, so while a generated
# placeholder sat here every `pnpm <script>` failed with ERR_PNPM_IGNORED_BUILDS
# before the script itself ran — including doctor, status, check and every gated
# entry point. CI failed at install for exactly that reason after the Pump SDKs
# arrived and pulled three more of them.
#
# All four are denied rather than approved:
#
#   esbuild          a devDependency of the test runner, which works without it
#   bigint-buffer    falls back to pure JS and says so at load
#   bufferutil       an optional ws speedup; ws works without it
#   utf-8-validate   likewise
#
# Approving any of them would add a postinstall script to the trust boundary of
# a repository that signs transactions, for a speedup nothing here measures.
# A denied build script is a decision; an undecided one is a broken install.
allowBuilds:
  bigint-buffer: false
  bufferutil: false
  esbuild: false
  utf-8-validate: false
