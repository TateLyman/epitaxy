name: ci

# Every check that decides whether this repository is telling the truth about
# itself, on both platforms it is developed and run on.
#
# Windows-only CI was not a smaller version of this — it was a different one.
# The signer correctly refuses group/world-readable keypair files, NTFS does not
# carry POSIX mode bits, and so a fixture bug that killed every signer test on
# Linux was invisible for the entire life of the repository.
#
# The mutation subset is not decoration. This project's defect history is code
# that was written, stored, listed in a schema, and read by no decision, and the
# only thing that has ever caught that class is a mutation that survives.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 11.13.0 is deprecated upstream: "This is a broken version. Please install
  # pnpm v11.13.1 or newer" — emitted by the registry during install, visible in
  # the run that first went red. 11.21.0 is `latest` and `latest-11`, and is not
  # deprecated. Pinned exactly rather than to a range so a future broken release
  # cannot arrive silently.
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'

jobs:
  check:
    strategy:
      # Never cancel the other platform on one failure. The whole reason this
      # matrix exists is that the two platforms fail differently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    # No secrets are needed and none are exposed. Every check runs offline:
    # the unit, property, replay, chaos and durability suites use fixtures and
    # temporary databases, never a provider. A CI job that needed a live API key
    # would fail on rate limits and teach everyone to ignore it.
    env:
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          # node:sqlite is built in from Node 24; this repository depends on it
          # rather than on a native addon, which is why Windows works at all.
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: secretscan
        run: pnpm secretscan

      - name: test
        run: pnpm test

      - name: replay against committed fixtures
        # The `pnpm replay` CLI reads the operator's research database, which is
        # gitignored and must never reach CI. The replay SUITE is the committed
        # equivalent: it writes a corpus, replays it, and asserts zero
        # divergence. That is the property the CLI checks in production.
        run: pnpm vitest run tests/replay --reporter=basic

      - name: durability
        run: pnpm vitest run tests/durability --reporter=basic

      - name: config and execution invariants
        # Cheap, and catches the change a reviewer skims past: canary quietly
        # becoming more permissive than live.
        run: pnpm vitest run tests/unit/p16-repair.test.ts --reporter=basic

  simulator:
    # Linux only. The Surfpool prebuilt binaries cover macOS and Linux x86-64;
    # there is no supported Windows-native build, which is why the simulator
    # work lives under WSL locally and under ubuntu-latest here.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: simulator interface and deterministic fixture
        # The fixture simulator exists precisely so this job does not depend on
        # mainnet availability or on a native binary being downloadable.
        run: pnpm vitest run tests/simulator --reporter=basic
      - name: simulator doctor
        run: pnpm simulator:doctor

  mutation:
    # A bounded subset, on the modules where a silent failure costs money.
    #
    # Its own job, and never concurrent with `check`, because the mutation
    # scripts rewrite source files in place. Two of them running against one
    # checkout would restore each other's originals and report nonsense.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pnpm install --frozen-lockfile
      - name: mutate — impact, diagnostics, ATA, admissibility, policy
        run: python scripts/mutate-p2a1.py
      - name: mutate — halts and risk caps
        run: python scripts/mutate-halts.py
      - name: mutate — ledger and clocks
        # A NON-UTC timezone, deliberately.
        #
        # GitHub runners are UTC, where `setHours` and `setUTCHours` return the
        # same value — so the "day boundary is local time, not UTC" mutation is
        # undetectable there, and the suite reported it as surviving. That is
        # the same blindness that let a Windows-only CI miss a POSIX permission
        # bug: a check cannot catch a class of defect it cannot experience.
        #
        # Verified under WSL that the ledger and durability suites are green in
        # both zones, so this hardens the check without weakening it.
        env:
          TZ: America/New_York
        run: python scripts/mutate-ledger.py

  release-manifest:
    runs-on: ubuntu-latest
    needs: [check, simulator, mutation]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build release manifest
        run: pnpm release:manifest
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: artifacts/release-manifest.json
          retention-days: 90
