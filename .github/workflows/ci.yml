name: ci

# Every check that decides whether this repository is telling the truth about
# itself. It runs on every push and every pull request, and `master` is
# protected on it.
#
# The mutation subset is not optional decoration. This project's entire defect
# history is code that was written, stored, listed in a schema, and read by no
# decision — and the only thing that has ever caught that class is a mutation
# that survives. A test suite that passes against a broken implementation is not
# evidence.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No secrets are needed and none are exposed. Every check below runs
    # offline: the unit, property, replay, chaos and durability suites use
    # fixtures and temporary databases, never a provider. A CI job that needed a
    # live API key would fail on rate limits and teach everyone to ignore it.
    env:
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          # node:sqlite is built in from Node 24 and this repository depends on
          # it rather than on a native addon.
          node-version: '24'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: secretscan
        run: pnpm secretscan

      - name: test
        run: pnpm test

      - name: replay against committed fixtures
        # Uses the test corpus, not the operator's research database, which is
        # gitignored and must never reach CI.
        run: pnpm vitest run tests/replay --reporter=basic

      - name: config invariants
        # Cheap, and catches the class of change that a reviewer skims past:
        # canary quietly becoming more permissive than live.
        run: pnpm vitest run tests/unit/p16-repair.test.ts --reporter=basic

  mutation:
    # A bounded subset, on the modules where a silent failure costs money.
    # The full sweep is minutes of vitest restarts and belongs in a nightly job,
    # not in the path of every PR.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pnpm install --frozen-lockfile
      - name: mutate — impact, diagnostics, ATA, admissibility, policy
        run: python scripts/mutate-p2a1.py
      - name: mutate — halts and risk caps
        run: python scripts/mutate-halts.py

  release-manifest:
    runs-on: ubuntu-latest
    needs: [check, mutation]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build release manifest
        run: pnpm release-manifest
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: artifacts/release-manifest.json
          retention-days: 90
